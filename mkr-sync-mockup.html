<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MKR SYNC 목업</title>
  <style>
    :root {
      --navy: #10233f;
      --muted: #68758a;
      --line: #d9e1eb;
      --green: #0c9b62;
      --green-dark: #08794c;
      --blue: #1677ed;
      --bg: #f4f7fb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 16px;
      background: var(--bg);
      color: var(--navy);
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", Arial, sans-serif;
    }

    .app {
      width: min(760px, 100%);
      overflow: hidden;
      border: 1px solid #cbd5e1;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 18px 50px rgba(31, 55, 85, 0.14);
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 22px 28px;
      border-bottom: 1px solid #e7edf4;
    }

    .excel-icon {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      background: #107c41;
      color: white;
      font-size: 25px;
      font-weight: 800;
      box-shadow: inset -7px 0 rgba(0, 0, 0, 0.12);
    }

    .brand {
      margin: 0;
      font-size: 24px;
      letter-spacing: -0.6px;
    }

    .content { padding: 38px 40px 34px; }

    .intro { margin-bottom: 30px; }

    .intro h1 {
      margin: 0 0 8px;
      font-size: 28px;
      letter-spacing: -1px;
    }

    .intro p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .field { margin-bottom: 22px; }

    label {
      display: block;
      margin-bottom: 9px;
      font-weight: 700;
      font-size: 15px;
    }

    .file-row { display: flex; gap: 10px; }

    input[type="text"], .file-name {
      width: 100%;
      height: 50px;
      padding: 0 15px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      outline: none;
      color: var(--navy);
      background: #fff;
      font: inherit;
      font-size: 15px;
    }

    input[type="text"]:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(22, 119, 237, 0.12);
    }

    .file-name {
      display: flex;
      align-items: center;
      color: var(--muted);
      background: #fbfcfe;
    }

    button {
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    button:hover { transform: translateY(-1px); }
    button:active { transform: translateY(0); }

    .file-button {
      flex: 0 0 132px;
      border: 1px solid var(--blue);
      color: var(--blue);
      background: #fff;
    }

    .file-button:hover { background: #eff6ff; }

    .primary {
      width: 100%;
      height: 54px;
      margin-top: 8px;
      color: white;
      background: var(--green);
      box-shadow: 0 7px 16px rgba(12, 155, 98, 0.2);
      font-size: 17px;
    }

    .primary:hover { background: var(--green-dark); }

    .helper {
      margin: 18px 0 0;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
    }

    .status {
      min-height: 24px;
      margin-top: 18px;
      color: var(--green-dark);
      text-align: center;
      font-size: 14px;
      font-weight: 700;
    }

    .status.error { color: #c2410c; }

    input[type="file"] { display: none; }

    @media (max-width: 600px) {
      .content { padding: 28px 22px 26px; }
      .topbar { padding: 18px 22px; }
      .intro h1 { font-size: 24px; }
      .file-row { display: block; }
      .file-button { width: 100%; height: 46px; margin-top: 9px; }
    }
  </style>
</head>
<body>
  <main class="app" aria-label="MKR SYNC 목업">
    <header class="topbar">
      <div class="excel-icon" aria-hidden="true">X</div>
      <h1 class="brand">MKR SYNC</h1>
    </header>

    <section class="content">
      <div class="intro">
        <h2>엑셀 MKR 시트 생성</h2>
        <p>엑셀 파일을 선택하고 MKR 번호를 입력하면 시트를 생성합니다.</p>
      </div>

      <div class="field">
        <label for="excelFile">엑셀 파일</label>
        <div class="file-row">
          <div class="file-name" id="fileName">선택된 파일 없음</div>
          <label class="file-button" for="excelFile" style="display:grid;place-items:center;cursor:pointer;margin:0;">파일 선택</label>
          <input id="excelFile" type="file" accept=".xlsx,.xlsm,.xls" />
        </div>
      </div>

      <div class="field">
        <label for="mkrNumber">MKR 번호</label>
        <input id="mkrNumber" type="text" placeholder="예: MKR-001" autocomplete="off" />
      </div>

      <button class="primary" id="createSheet" type="button">시트 생성</button>
      <p class="helper">초안 시트를 복사하여 MKR 시트를 생성합니다.</p>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </section>
  </main>

  <script>
    const excelFile = document.getElementById("excelFile");
    const fileName = document.getElementById("fileName");
    const mkrNumber = document.getElementById("mkrNumber");
    const createSheet = document.getElementById("createSheet");
    const status = document.getElementById("status");

    excelFile.addEventListener("change", () => {
      fileName.textContent = excelFile.files[0]?.name || "선택된 파일 없음";
      status.textContent = "";
      status.classList.remove("error");
    });

    createSheet.addEventListener("click", () => {
      const file = excelFile.files[0];
      const number = mkrNumber.value.trim();

      if (!file) {
        status.textContent = "엑셀 파일을 먼저 선택해 주세요.";
        status.classList.add("error");
        return;
      }

      if (!number) {
        status.textContent = "MKR 번호를 입력해 주세요.";
        status.classList.add("error");
        mkrNumber.focus();
        return;
      }

      status.classList.remove("error");
      status.textContent = `${number} 시트 생성 준비가 완료되었습니다. (목업)`;
    });
  </script>
</body>
</html>
